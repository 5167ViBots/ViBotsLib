# Push a tag matching gradle.properties libVersion (e.g. v2026.1.0) to publish both libraries
# to GitHub Pages: https://5167vibots.github.io/ViBotsLib/
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Check tag matches libVersion
        run: |
          version=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match libVersion=$version in gradle.properties"
            exit 1
          fi

      # Start from what's already published, so earlier versions stay downloadable and
      # maven-metadata.xml keeps listing them (robot projects pin exact versions).
      - name: Fetch current site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            mkdir -p build/site
            git --work-tree=build/site checkout origin/gh-pages -- .
          fi

      - name: Refuse to overwrite a released version
        run: |
          version=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          if [ -d "build/site/repo/com/vibots5167/vibotslib-java/$version" ]; then
            echo "::error::$version is already published - bump libVersion"
            exit 1
          fi

      - name: Build, test, and publish to build/site
        run: ./gradlew site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/site
          keep_files: true
          enable_jekyll: false
          commit_message: Release ${{ github.ref_name }}

      # Attach the jars and vendordep JSONs to the tag's GitHub Release (for browsing / manual download -
      # robot projects still install through the vendordep URL).
      # - Release created on github.com (Releases -> Draft a new release): files are added, its title and
      #   notes are left alone.
      # - Tag pushed from git / VS Code / GitHub Desktop: the Release is created here, with install URLs and
      #   generated notes. Versions with a "-" (2027.0.0-beta.1) are marked as pre-releases.
      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^libVersion=' gradle.properties | cut -d= -f2)
          year=$(grep '^frcYear=' gradle.properties | cut -d= -f2)
          files=()
          for lib in vibotslib-java vibotslib-ctre-java; do
            for suffix in "" -sources -javadoc; do
              files+=("build/site/repo/com/vibots5167/$lib/$version/$lib-$version$suffix.jar")
            done
          done
          files+=("build/site/ViBotsLib-frc$year-latest.json" "build/site/ViBotsLib-CTRE-frc$year-latest.json")
          ls -l "${files[@]}"

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
            notes="Install (WPILib: Manage Vendor Libraries -> Install new library (online)):
          - https://5167vibots.github.io/ViBotsLib/ViBotsLib-frc$year-latest.json
          - https://5167vibots.github.io/ViBotsLib/ViBotsLib-CTRE-frc$year-latest.json (CTRE robots)"
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "ViBotsLib $version" --notes "$notes" --generate-notes --verify-tag "${prerelease[@]}"
          fi
