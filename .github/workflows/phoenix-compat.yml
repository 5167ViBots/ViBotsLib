# Daily: build ViBotsLib-CTRE against the newest Phoenix 6 for each maintained season, and open an issue
# if it breaks. Checks main plus any season maintenance branch (named like 2026), each against the Phoenix
# release for that branch's frcYear. Also opens a one-time issue when next season's Phoenix appears.
# Note: GitHub pauses scheduled workflows after 60 days without commits - re-enable in the Actions tab.
name: Phoenix compatibility

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: |
          list=$(git ls-remote --heads "https://github.com/${{ github.repository }}.git" \
            | sed 's|.*refs/heads/||' | grep -E '^(main|20[0-9]{2})$' | jq -R . | jq -sc .)
          echo "Branches: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  check:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Find latest Phoenix 6 for this branch's season
        id: phx
        run: |
          year=$(grep '^frcYear=' gradle.properties | cut -d= -f2)
          url="https://maven.ctr-electronics.com/release/com/ctre/phoenix6/latest/Phoenix6-frc$year-latest.json"
          v=$(curl -fsSL "$url" | jq -r .version)
          echo "Latest Phoenix 6 for $year: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if already tested
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .phoenix-tested
          key: phoenix-tested-${{ matrix.branch }}-${{ steps.phx.outputs.version }}

      - uses: actions/setup-java@v4
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build and test against it
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew build -PphoenixVersion=${{ steps.phx.outputs.version }}

      - name: Remember this version passed
        if: steps.seen.outputs.cache-hit != 'true'
        run: echo "${{ steps.phx.outputs.version }}" > .phoenix-tested

      - uses: actions/cache/save@v4
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          path: .phoenix-tested
          key: phoenix-tested-${{ matrix.branch }}-${{ steps.phx.outputs.version }}

      - name: Open an issue
        if: failure() && steps.phx.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
          VERSION: ${{ steps.phx.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="ViBotsLib-CTRE ($BRANCH) fails against Phoenix $VERSION"
          if [ "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')" != "0" ]; then
            echo "Issue already open"
          else
            gh issue create --title "$title" --body "Building branch \`$BRANCH\` against Phoenix 6 $VERSION failed: $RUN_URL

          Robot projects that update Phoenix to $VERSION may crash with NoSuchMethodError / NoClassDefFoundError
          in ViBotsLib-CTRE code. Fix the build on \`$BRANCH\`, bump libVersion and release."
          fi

  next-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open a one-time issue when next season's Phoenix 6 is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          year=$(grep '^frcYear=' gradle.properties | cut -d= -f2)
          next=$((year + 1))
          url="https://maven.ctr-electronics.com/release/com/ctre/phoenix6/latest/Phoenix6-frc$next-latest.json"
          if ! v=$(curl -fsSL "$url" | jq -r .version); then
            echo "No Phoenix 6 for $next yet"
            exit 0
          fi
          # Search every state, so closing the issue keeps it from coming back.
          if [ "$(gh issue list --state all --search "\"Phoenix 6 for $next is available\" in:title" --json number --jq 'length')" != "0" ]; then
            echo "Already reported"
            exit 0
          fi
          gh issue create --title "Phoenix 6 for $next is available ($v)" --body "CTRE published Phoenix 6 for the $next season ($v, may be a beta).

          Time for the new-season update - see \"New season\" in the README:
          1. Create a \`$year\` branch from main, so $year fixes can still be released.
          2. On main, update gradle.properties: frcYear=$next, wpilibVersion, phoenixVersion, libVersion (e.g. $next.0.0-beta.1).
          3. Fix what breaks, then tag a release from main."
